<html lang="pt-br">

    <title>atividade2</title>

<body>
    <script>
        let a = prompt("digite um número:");
        let b = prompt("digite outro número:");

        const multiplicar = (numeroA, numeroB) => {
            let resultado = numeroA * numeroB;
            return resultado;
        }
            alert(`${a} X ${b} = ${multiplicar(a,b)}`)
        
    </script>
