<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>numero</title>
</head>
<body>
    <script>
        //se não funcionasse teria que por "parseInt(prompt("digite um número:");"
        let a = prompt("digite um número:");
        let b = prompt("digite outro número:");

        MaiorNumero(a, b);

        function MaiorNumero(numeroA, numeroB) {
            let numero = 0;

            if( numeroA >= numeroB) {
                numero = numeroA;
            } else {
                numero = numeroB;
            }
            alert("O maior numero informado foi " + numero)
        }
</script>
</body>
</html>
